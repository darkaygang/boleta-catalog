name: BOLETA checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check dist/js/app.js && node --check dist/js/editor.js && node --check dist/js/hero-3d.js && node --check dist/js/wallpaper.js
      - run: node --test tests/test_payments.mjs
